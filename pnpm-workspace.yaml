packages:
  - apps/web
  - apps/recovery
  - apps/signer
storeDir: .local/pnpm-store
allowBuilds:
  '@swc/core': true
  cbor-extract: true
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/linux-x64': true
  '@embedded-postgres/linux-arm64': true
  esbuild: true
  sharp: true
  '@embedded-postgres/darwin-x64': false
  '@embedded-postgres/linux-arm': false
  '@embedded-postgres/linux-ia32': false
  '@embedded-postgres/linux-ppc64': false
  '@embedded-postgres/windows-x64': false
minimumReleaseAgeExclude:
  - '@solana/kit-plugin-wallet@0.21.0'

# Patched transitive Workflow dependencies; stay within their existing major versions.
overrides:
  'nanoid@>=4.0.0 <5.1.16': 5.1.16
  'devalue@>=5.1.0 <5.9.3': 5.9.3
